# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html
## Source: https://github.com/hexojs/hexo/

# Site
title: Lochnair's Lab
subtitle:
description: Deep dives into self-hosting, network security, and homelab wizardry.
author: Nils Andreas Svee
language: en
timezone: Europe/Oslo

marked:
  prependRoot: true
  postAsset: true

pandoc:
  args:
    - "-f"
    - "gfm"
    - "-t"
    - "html"
    - "--mathjax"

# URL
## If your site is put in a subdirectory, set url as 'http://yoursite.com/child' and root as '/child/'
url: https://www.lochnair.net
root: /
permalink: :year/:month/:day/:title/
permalink_defaults:

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render: 
   - "./source/um4mi.js"

# Writing
new_post_name: :title.md # File name of new posts
default_layout: post
post_asset_folder: true
titlecase: false # Transform title into titlecase
external_link: 1 # Open external links in new tab
filename_case: 0
render_drafts: false
relative_link: false
future: true
highlight:
  enable: true
  line_number: true
  auto_detect: false
  tab_replace:

# Category & Tag
default_category: uncategorized
category_map:
tag_map:

# Date / Time format
## Hexo uses Moment.js to parse and display date
## You can customize the date format as defined in
## http://momentjs.com/docs/#/displaying/format/
date_format: YYYY-MM-DD
time_format: HH:mm:ss

# Pagination
## Set per_page to 0 to disable pagination
per_page: 10
pagination_dir: page

# Extensions
## Plugins: https://hexo.io/plugins/
## Themes: https://hexo.io/themes/
theme: cactus


# Theme config
theme_config:
  colorscheme: dark
  highlight: tomorrow-night-bright

  projects_url: https://github.com/Lochnair

  nav:
    home: /
    articles: /archives
    projects: https://github.com/Lochnair
    Donate: /donate
    Hire me: /hire-me
    Source: https://github.com/Lochnair/blog

  social_links:
    -
      icon: whatsapp
      link: https://wa.me/message/PLZJG3KSRU2IK1
    -
      icon: mail
      link: mailto:contact@lochnair.net

  tags_overview: false

  posts_overview:
    show_all_posts: false
    post_count: 10
    sort_updated: false

  post:
    show_updated: false

  utterances:
    enabled: true
    repo: Lochnair/blog
    issue_term: pathname
    label: comment
    theme: photon-dark

  copyright:
    start_year: 2016
    end_year:

  umami_analytics:
    enabled: true
    id: 5c2abe74-d6b7-412d-8561-30377a71412b
    host: https://lochnair.net
    script_name: um4mi.js

minify:
  enable: true
  html:
    enable: false
  gzip:
    enable: true
      - '*.html'
      - '*.css'
      - '*.js'
      - '*.txt'
      - '*.ttf'
      - '*.atom'
      - '*.stl'
      - '*.xml'
      - '*.svg'
      - '*.eot'
      - '*.json'
  brotli:
    enable: true
    include:
      - '*.html'
      - '*.css'
      - '*.js'
      - '*.txt'
      - '*.ttf'
      - '*.atom'
      - '*.stl'
      - '*.xml'
      - '*.svg'
      - '*.eot'
      - '*.json'

# RSS feed
feed:
  type: atom
  path: atom.xml
  limit: 50
  hub:
  content:

# Generate sitemap
sitemap:
  path: sitemap.xml
